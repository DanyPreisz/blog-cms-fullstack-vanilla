<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog CMS</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">CMS mínimo</p>
      <h1>Blog</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Posts y comentarios</p><h1>Blog</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <form id="post-form" class="card form">
        <input id="title" placeholder="Título del post" maxlength="80" required />
        <textarea id="body" placeholder="Cuerpo en markdown (simple)" rows="6"></textarea>
        <button class="primary" type="submit">Publicar</button>
      </form>
      <p id="form-error" class="error" hidden></p>
      <div id="list"></div>
      <div id="detail" class="hidden card" style="padding:16px;margin-top:16px;"></div>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
